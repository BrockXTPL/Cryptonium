name: Build Cryptonium plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the jar
        run: mvn -B package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: Cryptonium-plugin
          path: target/Cryptonium-*.jar
